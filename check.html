<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; base-uri 'none'; form-action 'none'">
  <meta name="robots" content="noindex, nofollow">
  <title>EventSnap · Connection check</title>
  <link rel="stylesheet" href="app.css">
</head>
<body class="visitor">
<div class="bg"></div>
<main id="app" style="max-width:560px">
  <div class="brand" style="margin:1rem 0"><span class="logo"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l2-3h6l2 3h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg></span> EventSnap</div>
  <h1>Connection check</h1>
  <p class="muted">Run this on your phone <b>before</b> the event. Tip: open it in a private/incognito tab too, to be sure the page is public.</p>
  <ul class="checks" id="list"></ul>
  <div id="cam-area"></div>
  <p class="muted small" id="summary"></p>
  <button id="rerun" class="btn">Run again</button>
</main>
<script src="config.js"></script>
<script src="check.js"></script>
</body>
</html>
